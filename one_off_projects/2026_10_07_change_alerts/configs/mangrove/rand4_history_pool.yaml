model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.multitask.MultiTaskModel
      init_args:
        encoder:
        - class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
          init_args:
            model_id: OLMOEARTH_V1_2_BASE
            patch_size: 4
            token_pooling: false
            use_legacy_timestamps: false
        decoders:
          category:
          - class_path: rslearn.models.attention_pooling.SimpleAttentionPool
            init_args:
              in_dim: 768
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 64
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 64
              out_channels: 3
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          timestep:
          - class_path: rslearn.models.tokens_to_channels.TokensToChannels
            init_args:
              in_dim: 768
              out_dim: 1
              mask_fill_value: -10000.0
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 4
          - class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepHead
            init_args:
              input_key: sentinel2_l2a
              mode: AFTER
    optimizer:
      class_path: rslearn.models.olmoearth_pretrain.optimizer.LayerDecayAdamW
      init_args:
        lr: 0.0001
        layer_decay_rate: 0.65
        num_layers: 12
        encoder_prefix: model.encoder.0
    scheduler:
      class_path: rslearn.train.scheduler.PlateauScheduler
      init_args:
        factor: 0.2
        patience: 5
        min_lr: 0
        cooldown: 10
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/rslearn-eai/datasets/change_alerts/20261007/mangrove/train
    inputs:
      freq_rand_0:
        data_type: raster
        layers:
        - freq_rand_0
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      infreq_rand_0:
        data_type: raster
        layers:
        - infreq_rand_0
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      freq_rand_1:
        data_type: raster
        layers:
        - freq_rand_1
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      infreq_rand_1:
        data_type: raster
        layers:
        - infreq_rand_1
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      freq_rand_2:
        data_type: raster
        layers:
        - freq_rand_2
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      infreq_rand_2:
        data_type: raster
        layers:
        - infreq_rand_2
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      freq_rand_3:
        data_type: raster
        layers:
        - freq_rand_3
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      infreq_rand_3:
        data_type: raster
        layers:
        - infreq_rand_3
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      label_category:
        data_type: raster
        layers:
        - label_category
        bands:
        - label
        is_target: true
        dtype: INT32
      change_day:
        data_type: raster
        layers:
        - label_change_day
        bands:
        - label
        is_target: true
        passthrough: true
        dtype: INT32
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        input_mapping:
          category:
            label_category: targets
          timestep:
            change_day: targets
        tasks:
          category:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 3
              nodata_value: 0
              class_names:
              - nodata
              - no_change
              - mangrove_loss
              metric_kwargs:
                average: micro
              other_metrics:
                balanced_accuracy:
                  class_path: rslearn.change_alerts.metrics.BalancedAccuracy
                  init_args:
                    num_classes: 3
                change_auroc:
                  class_path: rslearn.change_alerts.metrics.ChangeAUROC
                  init_args:
                    none_class: 1
          timestep:
            class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepTask
            init_args:
              num_classes: 12
              enable_accuracy_metric: false
              other_metrics:
                accuracy:
                  class_path: rslearn.change_alerts.metrics.TimestepToleranceAccuracy
                  init_args:
                    tolerance: 0
                within1:
                  class_path: rslearn.change_alerts.metrics.TimestepToleranceAccuracy
                  init_args:
                    tolerance: 1
    batch_size: 8
    num_workers: 16
    train_config:
      transforms:
      - class_path: rslearn.change_alerts.sampler.ChangeTimeSeriesSampler
        init_args:
          options:
          - frequent: freq_rand_0
            infrequent: infreq_rand_0
          - frequent: freq_rand_1
            infrequent: infreq_rand_1
          - frequent: freq_rand_2
            infrequent: infreq_rand_2
          - frequent: freq_rand_3
            infrequent: infreq_rand_3
          output_key: sentinel2_l2a
          category_target: category
          timestep_target: timestep
          num_frequent: 4
          frequent_lookback_days: 60
          num_infrequent: 8
      - class_path: rslearn.train.transforms.flip.Flip
        init_args:
          image_selectors:
          - sentinel2_l2a
          - target/category/classes
          - target/category/valid
          - target/timestep/days
          - target/timestep/valid
      - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
        init_args:
          band_names:
            sentinel2_l2a:
            - B02
            - B03
            - B04
            - B08
            - B05
            - B06
            - B07
            - B8A
            - B11
            - B12
            - B01
            - B09
      tags:
        split: train
    val_config:
      transforms:
      - class_path: rslearn.change_alerts.sampler.ChangeTimeSeriesSampler
        init_args:
          options:
          - frequent: freq_rand_0
            infrequent: infreq_rand_0
          output_key: sentinel2_l2a
          category_target: category
          timestep_target: timestep
          num_frequent: 4
          frequent_lookback_days: 60
          num_infrequent: 8
          option_index: 0
          drop_keys:
          - freq_rand_1
          - infreq_rand_1
          - freq_rand_2
          - infreq_rand_2
          - freq_rand_3
          - infreq_rand_3
      - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
        init_args:
          band_names:
            sentinel2_l2a:
            - B02
            - B03
            - B04
            - B08
            - B05
            - B06
            - B07
            - B8A
            - B11
            - B12
            - B01
            - B09
      tags:
        split: val
    test_config:
      transforms:
      - class_path: rslearn.change_alerts.sampler.ChangeTimeSeriesSampler
        init_args:
          options:
          - frequent: freq_rand_0
            infrequent: infreq_rand_0
          output_key: sentinel2_l2a
          category_target: category
          timestep_target: timestep
          num_frequent: 4
          frequent_lookback_days: 60
          num_infrequent: 8
          option_index: 0
          drop_keys:
          - freq_rand_1
          - infreq_rand_1
          - freq_rand_2
          - infreq_rand_2
          - freq_rand_3
          - infreq_rand_3
      - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
        init_args:
          band_names:
            sentinel2_l2a:
            - B02
            - B03
            - B04
            - B08
            - B05
            - B06
            - B07
            - B8A
            - B11
            - B12
            - B01
            - B09
      tags:
        split: val
trainer:
  max_epochs: 100
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: rslearn.train.callbacks.checkpointing.ManagedBestLastCheckpoint
    init_args:
      monitor: val_category/balanced_accuracy
      mode: max
project_name: 2026_10_07_change_alerts
run_name: mangrove_rand4_history_pool
management_dir: ${RSLP_PREFIX}/projects
