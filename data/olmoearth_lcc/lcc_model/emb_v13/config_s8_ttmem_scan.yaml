# Stage 1 annual-embedding arm s8_ttmem_scan (card t-4hitzy), generated from
# config_bp_abs_qdrop_bpcat_1pass.yaml by the session's make_configs.py:
# 8 quarterly + 6 frequent images; history_context=False, temporal transformer=True (depth 2, time encoding), history_memory=True, history_in_scan=True; seed 0.
model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslp.olmoearth_lcc.lcc_model.model.ChangeModel
      init_args:
        encoder:
          class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
          init_args:
            model_id: OLMOEARTH_V1_2_BASE
            patch_size: 4
            token_pooling: false
            use_legacy_timestamps: false
        num_classes_binary: 3
        num_classes_src: 14
        num_classes_dst: 14
        num_classes_pre_change: 8
        num_classes_post_change: 21
        num_timesteps: 14
        num_pass1: null
        embedding_dim: 768
        decoder_stages:
        - - - 768
            - 3
        - - - 256
            - 3
        - - - 128
            - 3
        binary_loss_weight: 2.0
        binary_mode: breakpoint
        change_category_input: breakpoint
        temporal_depth: 2
        temporal_time_enc: true
        history_years: 4
        history_context: false
        history_memory: true
        history_in_scan: true
    optimizer:
      class_path: rslearn.models.olmoearth_pretrain.optimizer.LayerDecayAdamW
      init_args:
        lr: 0.0001
        layer_decay_rate: 0.65
        num_layers: 12
        encoder_prefix: model.encoder
    scheduler:
      class_path: rslearn.train.scheduler.PlateauScheduler
      init_args:
        factor: 0.2
        patience: 5
        min_lr: 0
        cooldown: 10
