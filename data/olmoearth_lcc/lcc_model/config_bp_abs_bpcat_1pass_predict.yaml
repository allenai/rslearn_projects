model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslp.olmoearth_lcc.lcc_model.model.ChangeModel
      init_args:
        encoder:
          class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
          init_args:
            model_id: OLMOEARTH_V1_2_BASE
            patch_size: 4
            token_pooling: false
            use_legacy_timestamps: false
        num_classes_binary: 3
        num_classes_src: 11
        num_classes_dst: 11
        num_classes_pre_change: 8
        num_classes_post_change: 20
        num_timesteps: 22
        embedding_dim: 768
        decoder_stages:
          - [[768, 3]]
          - [[256, 3]]
          - [[128, 3]]
        binary_loss_weight: 2.0
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: ${PREDICT_DS}
    inputs:
      sentinel2_quarterly:
        data_type: "raster"
        layers: ["sentinel2_quarterly"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      sentinel2_frequent_0:
        data_type: "raster"
        layers: ["sentinel2_frequent_0"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
    task:
      class_path: rslp.olmoearth_lcc.lcc_model.tasks.LCCMultiTask
      init_args:
        annotations_path: unused_in_predict_mode
        score_calibration:
          binary:
            a: 1.010961967891801
            b: -0.2885926438527159
          pre:
            a: 0.6758222546961952
            b: -0.4364784422699236
          post:
            a: 0.778144326119981
            b: -0.22049676072402102
          pre_margin:
            a: 0.0
            b: 5.099866427824192
          post_margin:
            a: 0.8870597919360723
            b: -0.7228560568493319
          source: run 17 (2026_11_22_lcc bp_abs_bpcat_1pass best.ckpt) val e30, fit 2026-11-22
        input_mapping:
          binary:
            label_binary: targets
          src:
            label_src: targets
          dst:
            label_dst: targets
          pre_change:
            label_pre_change: targets
          post_change:
            label_post_change: targets
          ts_start:
            label_binary: targets
          ts_end:
            label_binary: targets
        tasks:
          binary:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 3
              nodata_value: 0
          src:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 11
              nodata_value: 0
          dst:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 11
              nodata_value: 0
          pre_change:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 8
              nodata_value: 0
          post_change:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 20
              nodata_value: 0
          ts_start:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 22
          ts_end:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 22
    batch_size: 8
    num_workers: 16
    predict_config:
      groups: ["predict"]
      crop_size: 64
      load_all_crops: true
      overlap_pixels: 16
      skip_targets: true
      transforms:
        - class_path: rslp.olmoearth_lcc.lcc_model.transforms.PredictStackBuilder
        - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
          init_args:
            band_names:
              sentinel2_l2a: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
trainer:
  callbacks:
    - class_path: rslearn.train.prediction_writer.RslearnWriter
      init_args:
        output_layer: output_change
        selector: []
        # Must match predict_config.overlap_pixels.
        merger:
          class_path: rslearn.train.prediction_writer.RasterMerger
          init_args:
            overlap_pixels: 16
project_name: 2026_11_22_lcc
run_name: bp_abs_bpcat_1pass
management_dir: ${RSLP_PREFIX}/projects
