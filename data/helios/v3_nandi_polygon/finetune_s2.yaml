# Full fine-tune of OlmoEarth v1.2 Base on the Nandi polygon windows.
#
# Compose with common.yaml:
#   --config_paths+=data/helios/v3_nandi_polygon/common.yaml
#   --config_paths+=data/helios/v3_nandi_polygon/finetune_s2.yaml
#
# Uses LayerDecayAdamW rather than the old freeze-then-unfreeze recipe: earlier encoder
# blocks get a lower learning rate (base_lr * 0.65^(12 - i)), which preserves the
# pre-trained features while the later blocks and the head adapt. See
# docs/foundation_models/OlmoEarth.md in rslearn.
model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.multitask.MultiTaskModel
      init_args:
        encoder:
          - class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
            init_args:
              model_id: OLMOEARTH_V1_2_BASE
              patch_size: 1
              use_legacy_timestamps: false
        decoders:
          segment:
            - class_path: rslearn.models.conv.Conv
              init_args:
                in_channels: 768
                out_channels: 11
                # 1x1 beats 3x3 here: at patch_size=1 the encoder has already mixed
                # spatial context, and the labels are sparse enough that a 3x3 head
                # mostly smears them.
                kernel_size: 1
                activation:
                  class_path: torch.nn.Identity
            - class_path: rslearn.train.tasks.segmentation.SegmentationHead
              init_args:
                # Inverse-sqrt of the train pixel count per class, normalized on the
                # median (2451 px). Regenerate if the label set changes.
                weights:
                  - 0.96  # Maize       2640 px
                  - 0.85  # Sugarcane   3431 px
                  - 1.70  # Legumes      844 px
                  - 2.83  # Vegetables   307 px
                  - 1.11  # Coffee      1988 px
                  - 1.04  # Tea         2287 px
                  - 1.00  # Grassland   2451 px
                  - 0.58  # Trees       7295 px
                  - 0.69  # Shrubland   5172 px
                  - 1.24  # Water       1582 px
                  - 0.72  # Built-up    4734 px
    optimizer:
      class_path: rslearn.models.olmoearth_pretrain.optimizer.LayerDecayAdamW
      init_args:
        lr: 0.0001
        # Defaults (layer_decay_rate 0.65, num_layers 12) match OlmoEarth Base.
        layer_decay_rate: 0.65
        num_layers: 12
    scheduler:
      class_path: rslearn.train.scheduler.PlateauScheduler
      init_args:
        factor: 0.2
        patience: 3
        min_lr: 0
        cooldown: 5
data:
  init_args:
    train_config:
      tags:
        split: "train"
      transforms:
        - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
          init_args:
            band_names:
              sentinel2_l2a: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        - class_path: rslearn.train.transforms.flip.Flip
          init_args:
            image_selectors: ["sentinel2_l2a", "target/segment/classes", "target/segment/valid"]
trainer:
  max_epochs: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "epoch"
    - class_path: rslearn.train.callbacks.checkpointing.ManagedBestLastCheckpoint
      init_args:
        monitor: val_segment/AverageF1
        mode: max
project_name: 20260921_nandi_v2
run_name: finetune_s2_oe12base_ws16_ps1_layerdecay
management_dir: ${RSLP_PREFIX}/projects
