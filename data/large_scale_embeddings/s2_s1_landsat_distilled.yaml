model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.singletask.SingleTaskModel
      init_args:
        encoder:
          - class_path: rslearn.models.olmoearth_pretrain.model_period_timestamps.OlmoEarthPeriodTimestamps
            init_args:
              # The checkpoint is supplied at run time.
              # The 128-dim distilled student; its first 64 dims are a trained
              # Matryoshka prefix.
              projected_location_token_dim: 128
              use_location_token_output: true
              patch_size: 2
              embedding_size: 128
              normalize: true
              autocast_dtype: bfloat16
              # Must match the layers' query_config in the dataset config.
              period_duration: "30 days, 0:00:00"
              max_matches: 12
              compile_model: true
              sdpa_backends: ["cudnn", "flash", "efficient", "math"]
              forward_kwargs:
                # One embedding per 10 m pixel.
                location_query_patch_size: 1
                searchlight:
                  class_path: olmoearth_pretrain_minimal.olmoearth_pretrain_v1.nn.searchlight.SearchlightSettings
                  init_args:
                    compile: true
        decoder:
          - class_path: rslp.large_scale_embeddings.model.QuantizedEmbeddingHead
            init_args:
              l2_normalize: false
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    # Supplied at run time.
    path: placeholder
    inputs:
      sentinel2_l2a:
        data_type: "raster"
        layers: ["sentinel2_l2a"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      sentinel1:
        data_type: "raster"
        layers: ["sentinel1"]
        bands: ["vv", "vh"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
        required: false
      landsat:
        data_type: "raster"
        layers: ["landsat"]
        bands: ["B8", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B9", "B10", "B11"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
        required: false
    task:
      class_path: rslearn.train.tasks.embedding.EmbeddingTask
    # Searchlight runs one crop per forward.
    batch_size: 1
    num_workers: 16
    default_config:
      crop_size: 480
      transforms:
        # The model's normalization expects Sentinel-1 in dB.
        - class_path: rslearn.train.transforms.sentinel1.Sentinel1ToDecibels
          init_args:
            selectors: ["sentinel1"]
            skip_missing: true
    predict_config:
      load_all_crops: true
      overlap_pixels: 32
      skip_targets: true
trainer:
  callbacks:
    - class_path: rslearn.train.prediction_writer.RslearnWriter
      init_args:
        output_layer: output
        selector: []
        merger:
          class_path: rslearn.train.prediction_writer.RasterMerger
          init_args:
            # Set by the pipeline from location_query_patch_size and overlap_pixels.
            downsample_factor: 1
            overlap_pixels: 32
    - class_path: rslp.large_scale_embeddings.model.PredictHeartbeat
      init_args:
        every_n_batches: 50
        every_n_seconds: 120
